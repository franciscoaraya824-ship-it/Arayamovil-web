    margin: 0; background: var(--blanco); color: var(--texto);
    font-family: "Pompadour AM", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-synthesis: none; letter-spacing: .01em; line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
  }
  h1, h2, h3, strong, button, select, label, p, li, span, a { font-family: inherit; }
  .rv { opacity: 0; transform: translateY(28px); transition: opacity .6s ease, transform .6s ease; }
  .rv-h { opacity: 0; transform: translateX(-28px); transition: opacity .5s ease, transform .5s ease; }
  .rv-h::after { content: ""; display: block; height: 5px; width: 0; margin-top: 10px; background: var(--bar, #3890d8); transition: width .6s ease .25s; }
  .bar-c { --bar: #40d0e8; }
  .rv.in, .rv-h.in { opacity: 1; transform: none; }
  .rv-h.in::after { width: 72px; }
  @media (prefers-reduced-motion: reduce) {
    .rv, .rv-h { opacity: 1; transform: none; transition: none; }
    .rv-h::after { width: 72px; transition: none; }
  }
  .chev { transition: transform .25s ease; }
  .open .chev { transform: rotate(180deg); }
  .panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
  .open .panel { grid-template-rows: 1fr; }
  .panel > div { overflow: hidden; }
</style>

const BTN = "bg-[#2678bd] text-white shadow-[4px_4px_0_#0b2a4f] active:translate-x-[2px] active:translate-y-[2px] active:shadow-[2px_2px_0_#0b2a4f]";

function Cotizador() {
  const [paso, setPaso] = useState(1);
  const [servicio, setServicio] = useState(null);
  const [zona, setZona] = useState("");
  const [urgencia, setUrgencia] = useState(null);

  const puedeSeguir = paso === 1 ? !!servicio : paso === 2 ? !!zona && !!urgencia : true;
  const mensaje = servicio && zona && urgencia
    ? `Hola, necesito ayuda con ${servicio.id}. Estoy ubicado en ${zona} y es una ${urgencia.id}. ¿Tienen disponibilidad?`
    : "";
  const link = WA + encodeURIComponent(mensaje);
  const titulos = ["¿Qué necesitas?", "¿Dónde estás y qué tan urgente es?", "Confirma y envía"];
  const sel = (on) => on ? "border-[#3890d8] bg-[#e6f8fc]" : "border-slate-200 bg-white";
  const ico = (on) => on ? "bg-[#40d0e8] text-[#0b2a4f]" : "bg-[#0b2a4f] text-[#7fe0f0]";

  return html`
  <section id="cotizador" className="px-4 py-10 bg-[#e6f8fc]">
    <div className="max-w-md mx-auto bg-white rounded-none shadow-[4px_4px_0_#0b2a4f] border-2 border-[#0b2a4f] overflow-hidden rv">
      <div className="bg-[#0b2a4f] text-white px-5 pt-5 pb-4">
        <p className="text-xs tracking-widest text-[#bff1fa] uppercase">Paso ${paso} de 3</p>
        <h2 className="text-2xl mt-1 leading-tight">${titulos[paso - 1]}</h2>
        <div className="flex gap-2 mt-3">
          ${[1, 2, 3].map(n => html`<div key=${n} className=${"h-2 flex-1 rounded-none " + (n <= paso ? "bg-[#40d0e8]" : "bg-white/25")}></div>`)}
        </div>
      </div>

      <div className="p-5">
        ${paso === 1 && html`
          <div className="grid gap-3">
            ${SERVICIOS.map(s => html`
              <button key=${s.short} onClick=${() => setServicio(s)}
                className=${"flex items-center gap-4 w-full text-left rounded-none border-2 p-4 min-h-[72px] transition active:translate-y-[2px] " + sel(servicio?.short === s.short)}>
                <span className=${"shrink-0 w-12 h-12 rounded-full flex items-center justify-center " + ico(servicio?.short === s.short)}>
                  <${Icon} n=${s.icon} size=${26} />
                </span>
                <span className="flex-1 text-lg text-[#0b2a4f]">${s.short}</span>
                ${servicio?.short === s.short && html`<${Icon} n="check" cls="text-[#2678bd]" />`}
              </button>`)}
          </div>
        `}

        ${paso === 2 && html`
          <div>
            <label className="flex items-center gap-2 text-[#0b2a4f] mb-2" htmlFor="zona">
              <${Icon} n="pin" size=${20} cls="text-[#2678bd]" /> Tu zona
            </label>
            <select id="zona" value=${zona} onChange=${e => setZona(e.target.value)}
              className="w-full h-14 rounded-none border-2 border-[#0b2a4f] bg-white px-4 text-lg text-[#0b2a4f] focus:border-[#3890d8] focus:outline-none">
              <option value="">Selecciona tu zona…</option>
              ${ZONAS.map(z => html`<option key=${z} value=${z}>${z}</option>`)}
            </select>

            <p className="flex items-center gap-2 text-[#0b2a4f] mt-6 mb-2">
              <${Icon} n="clock" size=${20} cls="text-[#2678bd]" /> ¿Qué tan urgente es?
            </p>
            <div className="grid gap-3">
              ${URGENCIAS.map(u => html`
                <button key=${u.id} onClick=${() => setUrgencia(u)}
                  className=${"flex items-center gap-4 w-full text-left rounded-none border-2 p-4 min-h-[72px] transition active:translate-y-[2px] " + sel(urgencia?.id === u.id)}>
                  <span className=${"shrink-0 w-12 h-12 rounded-full flex items-center justify-center " + ico(urgencia?.id === u.id)}>
                    <${Icon} n=${u.icon} size=${26} />
                  </span>
                  <span className="flex-1">
                    <span className="block text-lg text-[#0b2a4f]">${u.label}</span>
                    <span className="block text-sm text-slate-500">${u.sub}</span>
                  </span>
                </button>`)}
            </div>
          </div>
        `}

        ${paso === 3 && html`
          <div>
            <div className="rounded-none bg-[#f6fbfe] border-2 border-[#0b2a4f] divide-y divide-sky-100">
              <div className="flex items-center gap-3 p-4"><${Icon} n=${servicio.icon} cls="text-[#2678bd]" />
                <div><p className="text-xs uppercase text-slate-500">Servicio</p><p className="text-[#0b2a4f]">${servicio.short}</p></div></div>
              <div className="flex items-center gap-3 p-4"><${Icon} n="pin" cls="text-[#2678bd]" />
                <div><p className="text-xs uppercase text-slate-500">Zona</p><p className="text-[#0b2a4f]">${zona}</p></div></div>
              <div className="flex items-center gap-3 p-4"><${Icon} n=${urgencia.icon} cls="text-[#2678bd]" />
                <div><p className="text-xs uppercase text-slate-500">Urgencia</p><p className="text-[#0b2a4f]">${urgencia.label}</p></div></div>
            </div>

            <div className="mt-4 rounded-none border-2 border-[#40d0e8] bg-[#e6f8fc] p-4 flex gap-3">
              <${Icon} n="info" size=${24} cls="text-[#2678bd] shrink-0 mt-0.5" />
              <p className="text-[#0b2a4f] text-sm leading-snug"><strong className="text-base">Valor visita técnica: $14.990.</strong> (Este valor se descuenta al 100% del total si apruebas el presupuesto del trabajo)</p>
            </div>

            <a href=${link} target="_blank" rel="noopener noreferrer"
              className="mt-5 flex items-center justify-center gap-3 w-full min-h-[64px] rounded-none bg-green-600 hover:bg-green-700 active:translate-y-[2px] text-white text-xl shadow-[4px_4px_0_#0b2a4f] transition">
              <${Icon} n="msg" size=${28} /> Enviar por WhatsApp
            </a>
            <p className="mt-3 text-center text-xs text-slate-500">Te responderemos para confirmar disponibilidad. Cotización sin compromiso.</p>
          </div>
        `}

        <div className="flex gap-3 mt-6">
          ${paso > 1 && html`
            <button onClick=${() => setPaso(paso - 1)}
              className="flex items-center justify-center gap-2 min-h-[56px] px-5 rounded-none border-2 border-[#3890d8] text-[#2678bd] active:translate-y-[2px]">
              <${Icon} n="left" size=${20} /> Volver
            </button>`}
          ${paso < 3 && html`
            <button onClick=${() => puedeSeguir && setPaso(paso + 1)} disabled=${!puedeSeguir}
              className=${"flex-1 flex items-center justify-center gap-2 min-h-[56px] rounded-none text-lg transition " +
                (puedeSeguir ? BTN : "bg-slate-200 text-slate-400")}>
              Siguiente <${Icon} n="right" size=${22} />
            </button>`}
        </div>
      </div>
    </div>
  </section>`;
}

function Servicios() {
  const [abierto, setAbierto] = useState(null);
  return html`
  <section className="px-5 py-10">
    <div className="max-w-md mx-auto">
      <div className="rv-h"><h2 className="text-3xl text-[#0b2a4f]">Nuestros servicios</h2>
      <p className="mt-1 text-sm text-slate-500">Toca un servicio para ver más.</p></div>
      <div className="mt-5 grid gap-3 rv">
        ${SERVICIOS.map((s, i) => html`
          <div key=${s.short} className=${"rounded-none border-2 bg-white shadow-[3px_3px_0_#bfeef7] overflow-hidden " + (abierto === i ? "open border-[#40d0e8]" : "border-[#0b2a4f]/25")}>
            <button onClick=${() => setAbierto(abierto === i ? null : i)} aria-expanded=${abierto === i}
              className="w-full flex items-center gap-3 p-4 min-h-[68px] text-left active:bg-[#e6f8fc]">
              <span className="shrink-0 w-11 h-11 rounded-full bg-[#0b2a4f] text-[#40d0e8] flex items-center justify-center"><${Icon} n=${s.icon} size=${24} /></span>
              <span className="flex-1 text-lg text-[#0b2a4f]">${s.short}</span>
              <${Icon} n="down" size=${28} cls="chev text-[#2678bd] shrink-0" />
            </button>
            <div className="panel"><div>
              <p className="px-4 pb-4 text-[#2b4d6b] leading-relaxed">${s.desc}</p>
            </div></div>
          </div>`)}
      </div>
    </div>
  </section>`;
}

/* ====== CLIENTES FELICES ======
   Para agregar un caso real, completa un objeto así (foto = imagen en base64 o null):
   { foto: "data:image/jpeg;base64,...", nombre: "María P.", zona: "La Serena", servicio: "Calefont",
     comentario: "Texto del chat de WhatsApp", hora: "18:42" }
   Mientras la lista esté vacía se muestran 3 espacios de ejemplo. */
const CLIENTES = [];

function Clientes() {
  const hay = CLIENTES.length > 0;
  const items = hay ? CLIENTES : [null, null, null];
  return html`
  <section className="px-5 py-10 bg-white border-y-4 border-[#0b2a4f]">
    <div className="max-w-md mx-auto rv-h">
      <p className="text-xs tracking-widest uppercase text-[#2678bd]">Trabajos reales</p>
      <h2 className="text-3xl text-[#0b2a4f] leading-tight">Clientes felices</h2>
      <p className="mt-1 text-sm text-slate-500">Fotos de trabajos terminados y lo que nos escriben por WhatsApp.</p>
    </div>
    <div className="mt-5 -mx-5 px-5 flex gap-4 overflow-x-auto snap-x snap-mandatory pb-4 rv" style=${{ scrollbarWidth: "none" }}>
      ${items.map((c, i) => html`
        <article key=${i} className=${"snap-start shrink-0 w-[82%] max-w-[340px] border-2 bg-white " + (c ? "border-[#0b2a4f] shadow-[5px_5px_0_#0b2a4f]" : "border-dashed border-[#0b2a4f]/50")}>
          <div className="relative aspect-[4/3] bg-[#e6f8fc] border-b-2 border-[#0b2a4f] flex items-center justify-center overflow-hidden">
            ${c && c.foto
              ? html`<img src=${c.foto} alt=${"Trabajo de " + (c.servicio || "Arayamóvil")} className="w-full h-full object-cover" />`
              : html`<div className="text-center text-[#2678bd]"><${Icon} n="camera" size=${44} cls="mx-auto" /><p className="mt-2 text-sm">Foto del trabajo</p></div>`}
            ${c && c.servicio && html`<span className="absolute left-0 bottom-0 bg-[#0b2a4f] text-[#40d0e8] text-xs px-3 py-1">${c.servicio}</span>`}
          </div>
          <div className="p-4">
            <div className="flex items-center justify-between">
              <div className="flex text-[#f5b400]">${[1,2,3,4,5].map(n => html`<${Icon} key=${n} n="star" size=${16} />`)}</div>
              <span className="text-xs text-slate-500">${c ? c.nombre + (c.zona ? " · " + c.zona : "") : "Nombre · Sector"}</span>
            </div>
            <div className="mt-3 bg-[#d9fdd3] border-2 border-[#0b2a4f] p-3">
              <p className="flex items-center gap-1 text-[11px] text-green-800"><${Icon} n="msg" size=${12} /> WhatsApp</p>
              <p className="mt-1 text-[#0b2a4f] leading-snug">${c ? c.comentario : "Aquí irá el comentario del cliente, tal como lo escribió en el chat."}</p>
              <p className="mt-1 flex items-center justify-end gap-1 text-[11px] text-slate-500">${c && c.hora ? c.hora : "00:00"} <${Icon} n="checks" size=${14} cls="text-[#2678bd]" /></p>
            </div>
          </div>
        </article>`)}
    </div>
  </section>`;
}

function App() {
  React.useEffect(() => {
    const els = document.querySelectorAll(".rv, .rv-h");
    if (!("IntersectionObserver" in window)) { els.forEach(e => e.classList.add("in")); return; }
    const io = new IntersectionObserver((entries) => {
      entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } });
    }, { threshold: 0.08, rootMargin: "0px 0px -6% 0px" });
    els.forEach(e => io.observe(e));
    return () => io.disconnect();
  }, []);
  const irCotizador = () => document.getElementById("cotizador").scrollIntoView({ behavior: "smooth" });
  const confianza = [
    ["award", "Más de 10 años de experiencia", "Hemos resuelto cientos de problemas como el tuyo. Llegamos sabiendo qué hacer."],
    ["shield", "1 mes de garantía técnica", "Si algo no queda como corresponde, volvemos. Tu tranquilidad está respaldada."],
    ["sparkles", "Trabajo limpio, siempre", "Cuidamos tu hogar y dejamos el lugar ordenado al terminar. Sin polvo ni desorden."],
    ["zap", "Rápidos en emergencias", "Atendemos urgencias con tarifa especial, porque un problema grave no puede esperar."],
  ];
  return html`
  <div>
    <header className="sticky top-0 z-20 bg-white border-b-4 border-[#40d0e8] px-4 py-3 shadow-[0_4px_0_#40d0e8]"
            style=${{ paddingTop: "calc(0.75rem + env(safe-area-inset-top, 0px))" }}>
      <div className="max-w-md mx-auto flex items-center gap-3">
        <img src=${LOGO} alt="Logo Araya Móvil" className="h-16 w-auto shrink-0" />
        <div className="min-w-0">
          <p className="text-[26px] leading-[1.05] text-[#0b2a4f]">Servicio Técnico <span className="text-[#3890d8]">Arayamóvil</span></p>
          <span className="inline-flex items-center gap-1.5 mt-1.5 bg-[#40d0e8] text-[#0b2a4f] text-xs px-3 py-1 rounded-none">
            <span className="w-2 h-2 rounded-none bg-[#0b2a4f] animate-pulse"></span> Urgencias 24/7
          </span>
        </div>
      </div>
    </header>

    <section className="px-5 pt-9 pb-12 bg-[#0b2a4f] border-b-4 border-[#40d0e8]">
      <div className="max-w-md mx-auto">
        <h1 className="text-[32px] leading-[1.1] text-white rv">¿Tubería rota, calefont apagado o lavadora detenida? <span className="text-[#40d0e8]">Llegamos a tu casa, rápido.</span></h1>
        <p className="mt-4 text-sky-100 text-base leading-relaxed rv" style=${{ transitionDelay: "120ms" }}>Más de 10 años resolviendo problemas del hogar en La Serena, Coquimbo y el Valle del Elqui. Trabajo limpio, rápido y con 1 mes de garantía técnica.</p>
        <button onClick=${irCotizador}
          className="mt-6 w-full min-h-[64px] rounded-none text-xl flex items-center justify-center gap-2 bg-[#40d0e8] text-[#0b2a4f] shadow-[4px_4px_0_#3890d8] active:translate-x-[2px] active:translate-y-[2px] active:shadow-[2px_2px_0_#3890d8]">
          Solicitar Asistencia Ahora <${Icon} n="right" size=${24} />
        </button>
        <p className="mt-3 text-center text-xs text-sky-200">Respondemos rápido · Atención de urgencias · Cotización sin compromiso</p>
      </div>
    </section>

    <${Servicios} />
    <${Cotizador} />

    <section className="px-5 py-10">
      <div className="max-w-md mx-auto">
        <h2 className="text-3xl text-[#0b2a4f] rv-h">¿Por qué elegirnos?</h2>
        <ul className="mt-5 grid gap-4">
          ${confianza.map(([i, t, d], k) => html`
            <li key=${t} className="flex gap-3 rv" style=${{ transitionDelay: (k * 100) + "ms" }}>
              <span className="shrink-0 w-11 h-11 rounded-full bg-[#e6f8fc] text-[#2678bd] flex items-center justify-center"><${Icon} n=${i} size=${22} /></span>
              <div><p className="text-lg text-[#0b2a4f]">${t}</p><p className="text-[#2b4d6b] text-sm leading-relaxed">${d}</p></div>
            </li>`)}
        </ul>
      </div>
    </section>

    <${Clientes} />

    <section className="px-5 py-10 bg-[#0b2a4f] text-white">
      <div className="max-w-md mx-auto">
        <h2 className="text-3xl leading-tight rv-h bar-c">Servicio técnico en La Serena, Coquimbo y el Valle del Elqui</h2>
        <p className="mt-4 text-sky-100 leading-relaxed rv">Somos un servicio técnico a domicilio con base en <strong className="text-[#40d0e8]">La Serena</strong> y atención en <strong className="text-[#40d0e8]">Coquimbo</strong>, <strong className="text-[#40d0e8]">Morrillos</strong> y sectores cercanos. Si necesitas un gasfíter, un técnico de calefont o la reparación de tu lavadora, vamos hasta tu puerta.</p>
        <p className="mt-3 text-sky-100 leading-relaxed rv">También cubrimos la ruta hacia el <strong className="text-[#40d0e8]">Valle del Elqui</strong>: atendemos en <strong className="text-[#40d0e8]">Altovalsol, Alfalfares, Algarrobito, El Rosario y Las Rojas</strong>, para que vivir un poco más lejos del centro no signifique quedarte sin ayuda cuando algo falla.</p>
        <p className="mt-3 text-sky-100 leading-relaxed rv">¿No ves tu sector en la lista? Escríbenos por WhatsApp y te confirmamos disponibilidad. <strong className="text-[#40d0e8]">Si estás cerca, probablemente llegamos.</strong></p>
        <button onClick=${irCotizador} className="mt-6 w-full min-h-[60px] rounded-none bg-[#40d0e8] text-[#0b2a4f] text-lg active:translate-y-[2px]">Cotizar ahora</button>
      </div>
    </section>

    <footer className="px-5 py-6 pb-28 text-center text-xs text-slate-500">© Servicio Técnico Arayamóvil · La Serena, Coquimbo y Valle del Elqui</footer>

    <a href=${WA + encodeURIComponent("Hola, necesito ayuda con un servicio técnico. ¿Tienen disponibilidad?")} target="_blank" rel="noopener noreferrer"
       aria-label="Escribir por WhatsApp"
       className="fixed right-4 z-30 w-16 h-16 rounded-none bg-green-600 text-white shadow-[4px_4px_0_#0b2a4f] flex items-center justify-center active:translate-y-[2px]"
       style=${{ bottom: "calc(1rem + env(safe-area-inset-bottom, 0px))" }}>
      <${Icon} n="msg" size=${30} />
    </a>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
